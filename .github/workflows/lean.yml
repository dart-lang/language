name: Lean CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# All permissions not specified are set to 'none'.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build and test Lean code
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          lake-package-directory: lean
          build: true
          test: true
