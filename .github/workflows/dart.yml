name: Dart CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# All permissions not specified are set to 'none'.
permissions:
  contents: read

env:
  PUB_ENVIRONMENT: bot.github

jobs:
  analyze:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1
        with:
            sdk: main
      - name: dart pub get (specification)
        run: dart pub get
        working-directory: specification
      - name: dart pub get (tools/corpus)
        run: dart pub get
        working-directory: tools/corpus/scripts
      - name: dart pub get (accepted/2.3/spread-collections/benchmarks)
        run: dart pub get
        working-directory: accepted/2.3/spread-collections/benchmarks
      - name: dart pub get (accepted/3.0/patterns/exhaustiveness_prototype)
        run: dart pub get
        working-directory: accepted/3.0/patterns/exhaustiveness_prototype
      - name: dart analyze --fatal-infos .
        run: dart analyze --fatal-infos .
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1
        with:
            sdk: main
      - name: dart pub get (accepted/3.0/patterns/exhaustiveness_prototype)
        run: dart pub get
        working-directory: accepted/3.0/patterns/exhaustiveness_prototype
      - name: dart test (accepted/3.0/patterns/exhaustiveness_prototype)
        run: dart test
        working-directory: accepted/3.0/patterns/exhaustiveness_prototype
