name = "flow_analysis"
version = "0.1.0"
defaultTargets = ["DartLang", "DartSemantics", "flow_analysis"]
testDriver = "Tests"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

[[require]]
name = "iris"
git.url = "https://github.com/leanprover-community/iris-lean.git"
git.subDir = "Iris"
rev = "v4.34.1"

# In `DartLang`, `DartSemantics` and `Tests`, warnings are errors. In particular, a `sorry` fails
# the build, including one that Lean inserts silently: a `local notation` that mentions a section
# variable, used in a `variable` binder, elaborates that variable to `sorry` without an error.
[[lean_lib]]
name = "DartLang"
leanOptions = { warningAsError = true }

[[lean_lib]]
name = "DartSemantics"
leanOptions = { warningAsError = true }

[[lean_lib]]
name = "FlowAnalysis"

# Tests: the package's `testDriver`, so `lake test` builds this library, and fails if any check
# in it fails.
[[lean_lib]]
name = "Tests"
leanOptions = { warningAsError = true }

[[lean_exe]]
name = "flow_analysis"
root = "Main"
